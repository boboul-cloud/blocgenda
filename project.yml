name: Blocgenda

options:
  bundleIdPrefix: com.oulhen
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.2"
    CURRENT_PROJECT_VERSION: "3"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    GCC_WARN_UNUSED_VARIABLE: NO

fileGroups:
  - project.yml
  - README.md
  - Tools

targets:
  Blocgenda:
    type: application
    platform: iOS
    sources:
      - path: Sources/Shared
      - path: Sources/App
      - path: Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oulhen.blocgenda
        PRODUCT_NAME: Blocgenda
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/Blocgenda.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    dependencies:
      - target: BlocgendaWidget
        embed: true
        codeSign: true

  BlocgendaWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/Shared
      - path: Sources/Widget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oulhen.blocgenda.widget
        PRODUCT_NAME: BlocgendaWidget
        # Le widget partage la charte mais pas le grossissement du texte :
        # ses gabarits sont imposés par le système. Voir Theme.swift.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) WIDGET
        INFOPLIST_FILE: Sources/Widget/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/BlocgendaWidget.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework

  BlocgendaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/UI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oulhen.blocgenda.uitests
        TEST_TARGET_NAME: Blocgenda
    dependencies:
      - target: Blocgenda

schemes:
  Blocgenda:
    build:
      targets:
        Blocgenda: all
        BlocgendaWidget: all
        BlocgendaUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - BlocgendaUITests
    archive:
      config: Release
